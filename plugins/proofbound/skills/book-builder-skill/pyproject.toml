[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "book-builder-skill"
version = "4.6.1"
description = "ProofBound book-builder skill — thin HTTP client; prose written locally, scaffold/render/persist server-side"
authors = [{name = "Proofbound", email = "team@proofbound.com"}]
license = {text = "LicenseRef-ProofBound-Source-Available"}
readme = "SKILL.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Script Mode only: batch chapter generation against the Anthropic API.
# Session Mode (the default) needs none of this — Claude writes prose directly.
script-mode = [
    "anthropic>=0.40",
]

[tool.proofbound.skill]
# Read by scripts/package-skill.sh. `target` picks the closing instructions and
# gates the shipped-artifact path lint; `runtime` injects the canonical auth
# client; `vendor` names extra source trees to inject from HEAD.
# (Kept free of monorepo paths on purpose -- this file ships.)
target = "claude-ai"
runtime = true
vendor = ["proofbound-portable"]

[tool.setuptools]
packages = []
